<g><rect x="670" y="120" width="140" height="108" rx="10" fill="#161b22" stroke="#30363d"/><rect x="670" y="120" width="140" height="108" rx="10" fill="#3fb950" fill-opacity=".06" stroke="#3fb950" stroke-width="1.6" opacity="0"><animate attributeName="opacity" values="0;0;1;.25;.25" keyTimes="0;0.500;0.531;0.650;1" dur="8.0s" begin="t.begin"/></rect><circle cx="692" cy="144" r="12" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/><text x="692" y="148.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3fb950">5</text><text x="710" y="149" font-size="14" font-weight="700" fill="#e6edf3">Check</text><text x="684" y="184" font-size="14" font-weight="600" fill="#3fb950">0 rules broken</text><text x="684" y="206" font-size="11.5" fill="#8b949e">independent checker</text></g>
