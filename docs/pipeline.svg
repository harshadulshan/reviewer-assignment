<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" role="img" aria-label="Animated pipeline for the demo workshop: 1 Submissions, 150 papers and 58 reviewers; 2 Expertise, TF-IDF with a soft maximum, recent work counts more; 3 Conflicts, 202 pairs ruled out; 4 Optimise, linear programming with a certificate (column generation); 5 Check, 0 rules broken; 6 Deliver, Excel and CSV with the reasons. If a reviewer drops out, re-plan keeping every pair that can stay." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How it works</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}.flow{animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="271" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="8.0s" begin="0s;t.end"/></rect>
<text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="600">From submissions to a review plan you can defend</text>
<text x="30" y="60" fill="#8b949e" font-size="13">Numbers from the demo workshop: real papers and researchers, 3 reviews per paper, at most 9 per reviewer.</text>
